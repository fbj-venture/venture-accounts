# A self-contained local environment: PostgreSQL, SeaweedFS (S3-compatible file
# storage) and the app, built from ./dockerfile.
#
#   docker compose up --build
#
# then open http://localhost:3000. Data lives in named volumes; `docker compose
# down -v` wipes it.
#
# Everything here is local-only: the secrets below are throwaway and the ports
# are published on localhost.

x-app-env: &app-env # `Postgres` is reached by service name inside the compose network.
  DATABASE_URL_UNPOOLED: postgresql://venture:venture@postgres:5432/venture
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: local-dev-secret-not-for-production
  APP_COMPANY: JudgeKnot
  # Resend can't run locally: the key only has to pass validation, so emails
  # (invitations, password resets) are not delivered.
  RESEND_API_KEY: re_local_placeholder
  EMAIL_FROM: JudgeKnot Accounts <accounts@example.com>
  # host.docker.internal resolves to the host from inside the containers AND, on
  # Docker Desktop, from your browser. That matters because file downloads are
  # presigned URLs that the browser fetches directly from SeaweedFS.
  S3_ENDPOINT: http://host.docker.internal:8333
  S3_REGION: us-east-1
  S3_BUCKET: venture-accounts
  S3_ACCESS_KEY_ID: venture-local
  S3_SECRET_ACCESS_KEY: venture-local-secret
  # Default admin user (remove ater a)
  # Only the migrate service uses these. `-` (not `:-`) so that an empty
  # ADMIN_EMAIL= in .env disables the admin instead of falling back to the default.
  ADMIN_NAME: ${ADMIN_NAME-Administrator}
  ADMIN_EMAIL: ${ADMIN_EMAIL-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD-my-password}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: venture
      POSTGRES_PASSWORD: venture
      POSTGRES_DB: venture
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venture -d venture"]
      interval: 3s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs
    # master + volume + filer + S3 gateway in one process.
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=128
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # One-shot: creates the bucket once the S3 gateway is accepting requests.
  create-bucket:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: venture-local
      AWS_SECRET_ACCESS_KEY: venture-local-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket venture-accounts 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://venture-accounts 2>/dev/null; do
          echo "waiting for SeaweedFS..."; sleep 2
        done
        echo "bucket ready"
    restart: "no"

  # One-shot: applies migrations, seeds the account types and creates the default
  # administrator. Runs from the dockerfile's build stage because the runtime
  # image has no source or tooling.
  #
  # The administrator is first-run setup only: it is created when the database
  # has no users, never again - so it stays gone once you delete it. Override per
  # run with ADMIN_EMAIL=... ADMIN_PASSWORD=... docker compose up, or put them in
  # a .env next to this file. To skip it entirely, set ADMIN_EMAIL= (empty) there.
  migrate:
    build:
      context: .
      dockerfile: dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    command: >
      sh -c "pnpm --filter @app/db db:migrate
      && pnpm --filter @app/db seed:account-types
      && pnpm --filter web create-admin"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  seaweedfs-data:
